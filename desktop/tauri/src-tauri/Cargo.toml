[package]
name = "maneki-desktop"
# Kept in sync with pyproject.toml on every build by
# scripts/sync_desktop_versions.py, which bumps this line and the matching
# Cargo.lock entry together (so the lock never drifts and the build log
# reads the real `Compiling maneki-desktop vX.Y.Z`).
version = "0.14.0"
edition = "2024"
rust-version = "1.88"
description = "Native desktop wrapper around the Maneki web UI."
authors = ["Morten Hansen <morten@winterop.com>"]
license = "AGPL-3.0-or-later"

[lib]
name = "maneki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
