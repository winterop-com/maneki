<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <title>Maneki</title>
        <script>
            /*
             * The palette, the density and the text scale, before the first paint.
             *
             * Applied here rather than in a React effect: an effect lands a frame after the
             * document does, so every load would flash the default under whatever was chosen --
             * and the size one is a reflow under the reader's eyes rather than a flash. The
             * names and the bounds are duplicated from lib/theme.ts and lib/preferences.ts,
             * and a test asserts they match.
             */
            ;(function () {
                var root = document.documentElement
                var palette = 'maneki'
                var density = 'comfortable'
                var scale = 1
                try {
                    var names = ['maneki', 'paper', 'contrast', 'tokyo', 'vinyl', 'cassette', 'neon']
                    var stored = localStorage.getItem('maneki.palette')
                    if (names.indexOf(stored) !== -1) palette = stored
                    if (localStorage.getItem('maneki.density') === 'compact') density = 'compact'
                    var size = Number(localStorage.getItem('maneki.font-scale'))
                    if (size >= 0.85 && size <= 1.2) scale = size
                } catch (error) {
                    // Storage denied: the app is drawn as it was designed, which is the default
                    // of all three.
                }
                root.setAttribute('data-theme', palette)
                root.setAttribute('data-density', density)
                root.style.setProperty('--font-scale', String(scale))
            })()
        </script>
        <script>
            /*
             * Which shell this is and which platform it is on, before the first paint.
             *
             * The window's traffic lights are drawn over the top-left of the page by both
             * desktop shells on macOS, and the clearance the strips under them need is a CSS
             * rule keyed on these two attributes -- so they have to be on <html> before the
             * first paint, or the rail's mark is drawn once beneath the lights and then jumps.
             *
             * The shell test is the one in lib/desktop.ts: the Tauri global first, because it
             * is a fact about the runtime, then the version Electron writes into its own user
             * agent. A test asserts the two copies say the same thing.
             */
            ;(function () {
                var root = document.documentElement
                var agent = navigator.userAgent || ''
                root.setAttribute(
                    'data-shell',
                    window.__TAURI__
                        ? 'tauri'
                        : agent.toLowerCase().indexOf('electron/') !== -1
                          ? 'electron'
                          : 'browser',
                )
                // navigator.platform is deprecated and still set in both webviews, which makes
                // it the fastest synchronous answer; the user agent is what answers where it
                // has been emptied.
                var platform = (navigator.platform || '') + ' ' + agent
                root.setAttribute(
                    'data-platform',
                    /mac/i.test(platform) ? 'darwin' : /win/i.test(platform) ? 'win32' : 'linux',
                )
            })()
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
