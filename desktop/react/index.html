<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maneki</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    // Tag the platform on <body> so desktop-overrides.css can apply
    // macOS-only rules (traffic-light clearance, app-region: drag).
    // navigator.platform is deprecated but still set in Electron/Tauri
    // webviews and is the fastest sync way to detect Darwin.
    document.addEventListener("DOMContentLoaded", () => {
      const ua = (navigator.userAgent || "").toLowerCase();
      const plat = (navigator.platform || "").toLowerCase();
      document.body.dataset.platform =
        plat.startsWith("mac") || ua.includes("mac os") ? "darwin" :
        plat.startsWith("win") || ua.includes("windows") ? "win32" : "linux";
      // Distinguish desktop wrapper (Tauri/Electron, where native traffic
      // lights overlap the top of the page) from a plain browser tab
      // (no traffic lights, so the traffic-light clearance must NOT
      // apply or the topbar looks pushed-in for no reason).
      document.body.dataset.shell =
        window.__TAURI__ ? "tauri" :
        ua.includes("electron/") ? "electron" : "browser";
      // Tauri's WebKit ignores `-webkit-app-region: drag` (we use that
      // for Electron). Tauri uses an HTML attribute instead. The topbar
      // is rendered by React after mount, so we add the attribute via
      // MutationObserver as soon as the element appears. Cheap + idempotent.
      const tagDrag = () => {
        const bar = document.querySelector(".mk-topbar");
        if (bar && !bar.hasAttribute("data-tauri-drag-region")) {
          bar.setAttribute("data-tauri-drag-region", "");
        }
        document.querySelectorAll(
          ".mk-topbar input, .mk-topbar button, .mk-topbar .mk-search-wrap"
        ).forEach((el) => {
          if (!el.hasAttribute("data-tauri-drag-region-disabled")) {
            el.setAttribute("data-tauri-drag-region-disabled", "");
          }
        });
      };
      tagDrag();
      const mo = new MutationObserver(tagDrag);
      mo.observe(document.documentElement, { childList: true, subtree: true });
    });

    // Tauri 2 runtime drag handler — `data-tauri-drag-region` alone is
    // flaky on dynamically-rendered DOM, and `-webkit-app-region: drag`
    // is ignored by WKWebView. Mirror the mousedown-delegation pattern so
    // the window can be moved by grabbing the topbar or fullscreen header.
    // No-op on Electron (Chromium honours app-region).
    function getTauriWindow() {
      const t = window.__TAURI__;
      if (!t) return null;
      if (typeof t.window?.getCurrentWindow === "function") return t.window.getCurrentWindow();
      if (typeof t.webviewWindow?.getCurrentWebviewWindow === "function") {
        return t.webviewWindow.getCurrentWebviewWindow();
      }
      if (typeof t.window?.getCurrent === "function") return t.window.getCurrent();
      return null;
    }
    document.addEventListener("mousedown", (event) => {
      if (event.buttons !== 1) return;
      const target = event.target;
      const dragRegion = target.closest?.(
        ".mk-topbar, .mk-fs-head, .mk-drag-strip, .mk-login-shell, .mk-resume-shell"
      );
      if (!dragRegion) return;
      if (target.closest("input, button, a, textarea, select, [role='button'], .mk-login-card, .mk-resume-card")) return;
      const tauriWin = getTauriWindow();
      if (!tauriWin?.startDragging) return;
      tauriWin.startDragging().catch((e) => console.warn("startDragging failed:", e));
    });
  </script>
</head>
<body>
  <!-- Always-on draggable strip across the top of the window (covers the
       traffic-light area on macOS). Pointer events stay enabled so mousedown
       reaches the Tauri handler; Electron honours `-webkit-app-region`. -->
  <div class="mk-drag-strip" data-tauri-drag-region></div>
  <div id="root"></div>
  <!-- Vite-built entry. Vite compiles the JSX, bundles the ES module graph
       (React, video.js, the app), and content-hashes the output — no
       in-browser Babel, no window.MK_* globals, no manual ?v= cache-bust. -->
  <script type="module" src="./main.jsx"></script>
</body>
</html>
