name: Desktop release

# Builds the desktop apps and attaches them to the GitHub release for the
# tag. `release.yml` creates that release (PyPI + notes) on the same tag;
# this only uploads assets, so it never clobbers the notes.
#
# Wrappers: Tauri (the primary - small native bundles; macOS is signed +
# notarized when the Apple secrets are set) and Electron (best-effort,
# unsigned). Linux/Windows are published untested. fail-fast is off so one
# platform/wrapper failing never blocks the others.
#
# Required repo secrets for a SIGNED + NOTARIZED macOS Tauri build (the
# build still succeeds unsigned if they're absent):
#   APPLE_CERTIFICATE            base64 of the exported Developer ID
#                                Application cert (.p12)
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     your Apple ID email
#   APPLE_PASSWORD               an app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID                your 10-char Team ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + upload (e.g. v0.11.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  tauri:
    name: tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      # The SPA is a Vite build now; tauri-action runs the config's
      # beforeBuildCommand (cd ../react && bun install && bun run build), so
      # the runner needs bun.
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential file

      - name: Build Tauri bundles (+ sign/notarize on macOS)
        uses: tauri-apps/tauri-action@v1
        env:
          # Apple signing + notarization. macOS only; if these are unset the
          # build still runs and produces an UNSIGNED .app/.dmg.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop/tauri

      - name: Upload Tauri bundles to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            desktop/tauri/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop/tauri/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/tauri/src-tauri/target/release/bundle/msi/*.msi
            desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe

  electron:
    name: electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Build the Vite SPA first — electron-builder ships desktop/react/dist
      # via extraResources, so it must exist (electron-builder does NOT run
      # the frontend build itself).
      - name: Build the SPA (Vite)
        working-directory: desktop/react
        run: bun install --frozen-lockfile && bun run build

      - name: Build Electron bundles (unsigned)
        working-directory: desktop/electron
        # Tauri is the signed macOS app; Electron is the best-effort extra.
        # Disable auto-discovery so electron-builder never tries to sign.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci || npm install
          npx --no-install electron-builder --publish never

      - name: Upload Electron bundles to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            desktop/electron/dist/*.dmg
            desktop/electron/dist/*.AppImage
            desktop/electron/dist/*.deb
            desktop/electron/dist/*.exe
