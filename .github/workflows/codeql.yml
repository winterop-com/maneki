name: CodeQL

# Static security analysis (code scanning). Runs on pushes + PRs to main and
# weekly, so findings show up in the Security tab. Dependabot covers the
# dependency/malware-advisory side; CodeQL covers the project's own code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # python = the package; javascript-typescript = the SPA + desktop wrappers;
        # actions = the workflows themselves; rust = the Tauri shell.
        language: [python, javascript-typescript, actions, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every language is read from source, nothing is compiled: building the Tauri
      # shell would need its system libraries on the runner for no better results.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
