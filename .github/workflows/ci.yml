name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # The client is a required check, not a nicety: scripts/copy_ui_static.py
      # copies desktop/app/dist into src/maneki/_ui_static, so it ships inside
      # the published wheel, and `make check` and `make coverage` are
      # Python-only and cannot see it. Format, lint, types and unit tests,
      # then the build itself. `make app-gate` installs with
      # `--frozen-lockfile`, so a desynced bun.lock fails here rather than in
      # a release build.
      - name: Check the client
        run: make app-gate

      - name: Build the client (the wheel ships it)
        run: cd desktop/app && bun run build

      - name: Install ffmpeg + libportaudio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: make check
        run: make check

      - name: make coverage
        run: make coverage

      # GitHub's dependency graph does not parse bun.lock, so the client's
      # resolved tree is invisible to Dependabot alerts even with the
      # manifest registered in dependabot.yml. That tree ships inside the
      # wheel (scripts/copy_ui_static.py), so audit it here instead.
      # Advisory only: `|| true` keeps a fresh upstream advisory from
      # blocking unrelated PRs. Read the step output, don't trust the tick.
      - name: Audit JavaScript dependencies
        run: |
          for dir in desktop/app desktop/electron; do
            echo "::group::bun audit $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun audit) || true
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
