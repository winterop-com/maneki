name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # The SPA is a required check, not a nicety: scripts/copy_ui_static.py
      # copies desktop/react/dist into src/maneki/_ui_static, so this build
      # ships inside the published wheel. `make check` and `make coverage`
      # are Python-only and cannot see it.
      #
      # `--frozen-lockfile` is the point of the step. Dependabot updates
      # package.json but never bun.lock (GitHub does not parse that format),
      # so a dependency PR arrives with the manifest and lockfile out of
      # sync. That mismatch shipped once already: the react major bump in
      # #84 passed this job, merged, and then broke every release build with
      # "lockfile had changes, but lockfile is frozen". Failing here means a
      # desynced lockfile can never reach main again - regenerate it with
      # `cd desktop/react && bun install` and commit the result.
      - name: Build the SPA (the wheel ships it)
        run: |
          cd desktop/react
          bun install --frozen-lockfile
          bun run build

      - name: Install ffmpeg + libportaudio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: make check
        run: make check

      - name: make coverage
        run: make coverage

      # GitHub's dependency graph does not parse bun.lock, so the React
      # SPA's resolved tree is invisible to Dependabot alerts even with the
      # manifest registered in dependabot.yml. That tree ships inside the
      # wheel (scripts/copy_ui_static.py), so audit it here instead.
      # Advisory only: `|| true` keeps a fresh upstream advisory from
      # blocking unrelated PRs. Read the step output, don't trust the tick.
      - name: Audit JavaScript dependencies
        run: |
          for dir in desktop/react desktop/electron; do
            echo "::group::bun audit $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun audit) || true
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
