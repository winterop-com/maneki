# Dependabot update PRs. Alerts are already on; this opens grouped update
# PRs on a weekly cadence so deps don't drift. Keep ecosystems aligned with
# every manifest in the repo: Python (pyproject), the GitHub Actions
# workflows, the two desktop wrappers (Electron / Tauri), and the client
# that both wrappers embed and the wheel ships.
version: 2

# GitHub Packages asks for a token even to read a public package, and
# Dependabot's own token is refused there, so it reads @winterop-com/sokkel-ui
# with SOKKEL_PACKAGES_TOKEN: a Dependabot secret holding a classic token with
# read:packages only. The scope makes Dependabot write its own .npmrc for it.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.SOKKEL_PACKAGES_TOKEN}}
    scope: "@winterop-com"

updates:
  # "uv", not "pip": the uv ecosystem rewrites uv.lock alongside pyproject.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/desktop/electron"
    schedule:
      interval: "weekly"
    groups:
      electron:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The client is not just a desktop concern: scripts/copy_ui_static.py
  # copies desktop/app/dist into src/maneki/_ui_static, so this tree ships
  # inside the published wheel.
  #
  # Majors are deliberately NOT grouped. One run once opened a single PR
  # carrying react 18 -> 19, react-router 6 -> 7 and vite 6 -> 8 at once
  # (#84); five breaking upgrades in one diff is not reviewable, and if it
  # regresses there is no way to tell which one did it. Minor and patch
  # updates still batch into one PR; each major arrives on its own.
  #
  # The JS trees are Bun projects (bun.lock, no package-lock.json), so they
  # use the "bun" ecosystem, which rewrites bun.lock itself. Under "npm"
  # Dependabot refuses a tree with a bun.lock and every update job fails.
  #
  # @winterop-com/sokkel-ui comes from GitHub Packages, read through the
  # github-packages registry above; desktop/app/.npmrc only names the
  # registry, because a variable there would be read as an empty token. It is
  # never bumped here: each sokkel-ui version is taken on purpose, in a change
  # that adopts what it brings.
  - package-ecosystem: "bun"
    directory: "/desktop/app"
    registries:
      - github-packages
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@winterop-com/*"
    groups:
      app:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/desktop/tauri/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri:
        patterns: ["*"]
